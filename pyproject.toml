[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "agentlens-audit"
version = "0.1.0"
description = "Multi-agent audit CLI: cost governance, decision audit, evidence chain, shadow agent detection, compliance"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
agentlens-audit = "agentlens_cli.__main__:main"

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp>=1.0"]

[tool.setuptools.packages.find]
include = ["agentlens_cli*"]