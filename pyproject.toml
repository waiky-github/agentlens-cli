[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "agentlens-audit"
version = "0.2.1"
description = "Multi-agent audit CLI: cost governance, decision audit, evidence chain, shadow agent detection, compliance"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
agentlens-audit = "agentlens_cli.__main__:main"

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["agentlens_cli*"]

[tool.setuptools.package-data]
agentlens_cli = ["data/*.jsonl"]