[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentlens-cli"
version = "0.1.0"
description = "Multi-agent cost governance CLI toolkit"
requires-python = ">=3.9"

[project.scripts]
agentlens-audit = "agentlens_cli.__main__:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["agentlens_cli*"]